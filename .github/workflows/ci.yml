name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mai-ru-software-house/dating-backend

jobs:
  test:
    name: Checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mairu
          POSTGRES_PASSWORD: mairu_ci
          POSTGRES_DB: mairu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mairu -d mairu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mairu:mairu_ci@localhost:5432/mairu_test
      TEST_DATABASE_URL: postgres://mairu:mairu_ci@localhost:5432/mairu_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply database migrations
        run: bun run db:deploy

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bunx prettier --check .

      - name: Run tests
        run: bun test

  build-and-push:
    name: Build and push image
    needs: test
    # Pull requests only run the checks above. Images are built from main, feature branches and
    # release tags (vX.Y.Z).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image version comes from the git tag, so it must match the version in package.json
      - name: Check the release tag
        if: github.ref_type == 'tag'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags look like v1.0.0, got $GITHUB_REF_NAME"
            exit 1
          fi
          package_version=$(jq -r .version package.json)
          if [ "${GITHUB_REF_NAME#v}" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi

      # Every image gets an immutable tag with the commit hash. Only main moves the `dev` tag,
      # and only a release tag adds the version (v1.0.0 becomes 1.0.0)
      - name: Work out the image tags
        id: tags
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          {
            echo "list<<EOF"
            echo "$image:$GITHUB_SHA"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "$image:dev"
            fi
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "$image:${GITHUB_REF_NAME#v}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
